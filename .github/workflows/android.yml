name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a build can be kicked off by hand when you want a fresh APK without pushing.
  workflow_dispatch:

# A second push to the same branch cancels the run already in flight; the older APK is of no
# interest once it has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Handles the Gradle distribution, the dependency cache and the build summary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image ships several platforms but not necessarily the one this project
      # compiles against, and AGP does not fetch SDK components on its own.
      #
      # Note the minor version: from API 36 the platforms are published as android-36.1,
      # android-37.0 and so on, so `platforms;android-37` is not a package that exists and
      # sdkmanager fails with "Failed to find package". compileSdk = 37 resolves to android-37.0.
      - name: Install the Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: synapse-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Only worth keeping when something failed -- the HTML report says which assertion and why.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
